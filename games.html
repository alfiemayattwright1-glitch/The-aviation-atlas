<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotter Quizzes & Games | The Aviation Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .page-header { padding: 4rem 1.5rem 2.5rem; background: var(--bg-card); border-bottom: 1px solid var(--border-subtle); text-align: center; }
    .page-header h1 { font-family: var(--font-heading); font-size: clamp(2.2rem, 4vw, 3rem); margin-bottom: 0.75rem; }
    .page-header p { color: var(--text-muted); max-width: 600px; margin: 0 auto; font-size: 1.05rem; }
    .container { max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; }
    
    .quiz-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 2.5rem; }
    .stat-bar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--accent-gold); font-weight: 700; }
    .question-title { font-family: var(--font-heading); font-size: 1.35rem; margin-bottom: 1.5rem; }
    .quiz-btn { display: block; width: 100%; padding: 1rem 1.25rem; margin: 0.75rem 0; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle); border-radius: 6px; color: #fff; text-align: left; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .quiz-btn:hover { border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.05); }
    .quiz-limit-notice { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--accent-gold); padding: 1.5rem; border-radius: 6px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">The Aviation <span>Atlas</span></a>
      <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="aircraft.html">Aircraft</a></li>
        <li><a href="airports.html">Airports</a></li>
        <li><a href="knowledge.html">Academy</a></li>
        <li><a href="community.html">Community Hub</a></li>
        <li><a href="assistant.html">AI Assistant</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="games.html" class="active">Quizzes</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="quiz-card" id="quizContainer">
      <!-- Dynamic Quiz or Limit Notice -->
    </div>
  </main>

  <footer>
    <p>&copy; 2026 The Aviation Atlas. All rights reserved.</p>
  </footer>

  <script>
    function toggleMenu() { document.getElementById('navLinks').classList.toggle('open'); }

    const QUESTIONS = [
      { q: "Which aircraft is universally nicknamed 'Queen of the Skies'?", options: ["Airbus A380", "Boeing 747", "Concorde", "Boeing 777"], correct: 1 },
      { q: "What is the IATA code for London Heathrow Airport?", options: ["LGW", "LHR", "STN", "LCY"], correct: 1 },
      { q: "At what cruising speed did Concorde typically operate across the Atlantic?", options: ["Mach 0.85", "Mach 1.2", "Mach 2.04", "Mach 3.5"], correct: 2 },
      { q: "Which transponder squawk code indicates a general in-flight emergency?", options: ["7500", "7600", "7700", "1200"], correct: 2 },
      { q: "What does ETOPS stand for in modern twin-engine commercial operations?", options: ["Extended-range Twin-engine Operational Performance Standards", "Engine Turbine Overheat Protection System", "External Traffic Observation Position Sensor", "Emergency Takeoff Procedure Standard"], correct: 0 }
    ];

    let currentQ = 0;
    let score = 0;

    function checkDailyLimit() {
      let today = new Date().toDateString();
      let record = JSON.parse(localStorage.getItem('atlas_game_limit') || '{"date":"","count":0}');
      
      if (record.date !== today) {
        record = { date: today, count: 0 };
        localStorage.setItem('atlas_game_limit', JSON.stringify(record));
      }
      return record;
    }

    function incrementLimit() {
      let today = new Date().toDateString();
      let record = JSON.parse(localStorage.getItem('atlas_game_limit') || '{"date":"","count":0}');
      record.count += 1;
      localStorage.setItem('atlas_game_limit', JSON.stringify(record));
    }

    function renderGame() {
      const limit = checkDailyLimit();
      const box = document.getElementById('quizContainer');

      if (limit.count >= 5) {
        box.innerHTML = `
          <div class="quiz-limit-notice">
            <h3 style="font-family: var(--font-heading); color: var(--accent-gold); margin-bottom: 0.5rem;">Daily Quiz Limit Reached</h3>
            <p style="color: var(--text-muted);">You have completed your 5 daily spotter challenge sessions. Come back tomorrow for new questions and score tracking!</p>
          </div>
        `;
        return;
      }

      if (currentQ >= QUESTIONS.length) {
        incrementLimit();
        box.innerHTML = `
          <div style="text-align: center;">
            <h2 style="font-family: var(--font-heading); margin-bottom: 1rem;">Quiz Completed!</h2>
            <p style="font-size: 1.2rem; color: var(--accent-gold); margin-bottom: 1.5rem;">Your Score: ${score} / ${QUESTIONS.length}</p>
            <button class="btn btn-primary" onclick="currentQ=0; score=0; renderGame();">Play Again</button>
          </div>
        `;
        return;
      }

      const item = QUESTIONS[currentQ];
      box.innerHTML = `
        <div class="stat-bar">
          <span>Question ${currentQ + 1} of ${QUESTIONS.length}</span>
          <span>Daily Plays Remaining: ${5 - limit.count}</span>
        </div>
        <div class="question-title">${item.q}</div>
        ${item.options.map((opt, i) => `
          <button class="quiz-btn" onclick="answer(${i}, ${item.correct})">${opt}</button>
        `).join('')}
      `;
    }

    function answer(selected, correct) {
      if (selected === correct) score++;
      currentQ++;
      renderGame();
    }

    renderGame();
  </script>
</body>
</html>
